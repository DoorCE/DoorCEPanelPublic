name: doorce_panel
description: "DoorCE Panel - A Flutter application for managing DoorCE data"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  multi_dropdown: ^3.2.1
  http: ^1.3.0
  file_picker: ^10.1.2
  http_parser: ^4.1.2
  mime: ^2.0.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.4
  universal_html: ^2.2.4
  logging: ^1.3.0
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - images/doorce_logo.png
    - images/doorce_loading.png
    - images/header_image.png
    - images/doorce_data.png
    - images/catalogue.png
    - images/options.png
    - images/dataset.png
    - images/distribution.png
    - images/service.png
    - images/data_series.png
    - images/schema.png
    - images/schema_series.png
    - images/person.png
    - images/organisation.png